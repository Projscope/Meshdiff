[build]
  command = "npm run build --workspace apps/web"
  publish = "apps/web/dist"

[functions]
  directory = "netlify/functions"

# Security headers (securityheaders.com flagged these as missing). CSP
# origins reflect what the app actually loads client-side:
# - script-src: Google Tag Manager (index.html's gtag.js snippet), plus
#   'unsafe-inline' for its inline config <script> block — a nonce-based
#   CSP isn't practical on a static Netlify build with no per-request
#   server render. Also needs blob: — drei's <Text>/<Text3D> (used by
#   AxisLabels and others) renders SDF fonts via troika-three-text, which
#   runs in a Web Worker that calls importScripts() on a blob: URL to load
#   its worker-module code. worker-src permits *creating* that worker, but
#   importScripts() calls made from inside an already-running worker are
#   governed by script-src, not worker-src — without blob: here, those
#   imports get blocked and the worker throws "did not return a callable
#   function" (seen in prod after the CSP was first added).
# - connect-src: Supabase (auth + direct-to-storage signed URLs, any
#   *.supabase.co project), the Fastify API (meshdiff-api.onrender.com,
#   see VITE_API_URL in api.ts), GA's own reporting endpoints (wildcarded
#   — GA4 reports through regionalized subdomains), and cdn.jsdelivr.net
#   — troika-three-text's unicode-font-resolver (used by drei's
#   <Text>/<Text3D>, e.g. AxisLabels) fetches glyph-coverage data from
#   jsDelivr on demand for characters outside the bundled font's basic
#   range. Also needs https://www.googletagmanager.com here (not just in
#   script-src) — script-src only covers loading the gtag.js <script> tag
#   itself; the Google tag's own internal remote-config/hit-relay fetches
#   back to googletagmanager.com are governed by connect-src, and without
#   it here those calls get silently CSP-blocked. The script still loads
#   and dataLayer still looks populated (gtm.load fires from the script
#   executing, not from a hit actually landing), so this failure mode is
#   invisible unless you check GA4 itself — diagnosed after GA4's Data
#   Streams panel showed "Data collection isn't active... No data
#   received" despite every other client-side signal looking healthy.
# - img-src: 'self' data: blob: plus GA's tracking-pixel domain,
#   *.supabase.co — project/version thumbnails are public Supabase
#   Storage URLs (see ProjectDetailPage.tsx/ProjectsListPage.tsx),
#   already allowed under connect-src but img-src is evaluated
#   separately for <img> loads and was missing it, blocking every
#   thumbnail — and blog.adafruit.com, hotlinked directly for their logo
#   in the landing page's testimonial section (LandingPage.tsx). Also
#   needs www.googletagmanager.com here specifically (not just
#   script-src/connect-src) — gtag.js sends some hits as an <img> pixel
#   beacon to googletagmanager.com/a and /td rather than fetch/XHR, and
#   without it here those loads get silently CSP-blocked. This was the
#   actual root cause of GA4 showing "Data collection isn't active"
#   despite every prior fix (Consent Mode signals, connect-src) — found
#   via Google Tag Assistant's Console log, which is the only tool of the
#   ones tried that surfaces img-src violations directly instead of just
#   showing a healthy-looking dataLayer with zero hits ever landing.
#   *.google-analytics.com stays here too for the fallback/legacy pixel
#   path some older GA integrations use.
# - worker-src: this app's entire diff/measure pipeline runs in Web
#   Workers (CLAUDE.md "3D Performance Rules") — 'self' covers Vite's
#   built worker bundles, blob: is a defensive fallback.
# - style-src 'unsafe-inline': a few components use inline style={{}} for
#   dynamic values (e.g. camera/canvas-driven positioning). Also needs
#   https://fonts.googleapis.com — index.html loads the Space Grotesk/IBM
#   Plex Sans stylesheet from Google Fonts (the brand re-theme's display/
#   body typefaces); 'unsafe-inline' only covers inline <style> and style
#   attributes, not a stylesheet fetched from a third-party origin.
# - font-src needs https://fonts.gstatic.com — the actual .woff2 files
#   Google Fonts' stylesheet references are served from that host, not
#   fonts.googleapis.com itself.
# frame-ancestors 'none' + X-Frame-Options: DENY together cover clickjacking
# protection across older and newer browsers.
# - Permissions-Policy omits interest-cohort — it was a FLoC-era feature
#   no current browser recognizes; including it just produced a harmless
#   but noisy "Unrecognized feature" console warning.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.google-analytics.com https://www.googletagmanager.com https://*.supabase.co https://blog.adafruit.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://meshdiff-api.onrender.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
