[build]
  command = "npm run build --workspace apps/web"
  publish = "apps/web/dist"

[functions]
  directory = "netlify/functions"

# Security headers (securityheaders.com flagged these as missing). CSP
# origins reflect what the app actually loads client-side:
# - script-src: Google Tag Manager (index.html's two gtag.js snippets) and
#   the UXCam recording SDK (index.html's inline loader), plus
#   'unsafe-inline' for their inline config <script> blocks — a nonce-based
#   CSP isn't practical on a static Netlify build with no per-request
#   server render. Also needs blob: — drei's <Text>/<Text3D> (used by
#   AxisLabels and others) renders SDF fonts via troika-three-text, which
#   runs in a Web Worker that calls importScripts() on a blob: URL to load
#   its worker-module code. worker-src permits *creating* that worker, but
#   importScripts() calls made from inside an already-running worker are
#   governed by script-src, not worker-src — without blob: here, those
#   imports get blocked and the worker throws "did not return a callable
#   function" (seen in prod after the CSP was first added).
# - connect-src: Supabase (auth + direct-to-storage signed URLs, any
#   *.supabase.co project), the Fastify API (meshdiff-api.onrender.com,
#   see VITE_API_URL in api.ts), GA/UXCam's own reporting endpoints
#   (wildcarded — GA4 reports through regionalized subdomains), and
#   cdn.jsdelivr.net — troika-three-text's unicode-font-resolver (used by
#   drei's <Text>/<Text3D>, e.g. AxisLabels) fetches glyph-coverage data
#   from jsDelivr on demand for characters outside the bundled font's
#   basic range.
# - img-src: 'self' data: blob: plus GA's tracking-pixel domain, and
#   *.supabase.co — project/version thumbnails are public Supabase
#   Storage URLs (see ProjectDetailPage.tsx/ProjectsListPage.tsx),
#   already allowed under connect-src but img-src is evaluated
#   separately for <img> loads and was missing it, blocking every
#   thumbnail.
# - worker-src: this app's entire diff/measure pipeline runs in Web
#   Workers (CLAUDE.md "3D Performance Rules") — 'self' covers Vite's
#   built worker bundles, blob: is a defensive fallback.
# - style-src 'unsafe-inline': a few components use inline style={{}} for
#   dynamic values (e.g. camera/canvas-driven positioning).
# frame-ancestors 'none' + X-Frame-Options: DENY together cover clickjacking
# protection across older and newer browsers.
# - Permissions-Policy omits interest-cohort — it was a FLoC-era feature
#   no current browser recognizes; including it just produced a harmless
#   but noisy "Unrecognized feature" console warning.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://www.googletagmanager.com https://websdk-recording.uxcam.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://meshdiff-api.onrender.com https://*.google-analytics.com https://*.analytics.google.com https://*.uxcam.com wss://*.uxcam.com https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
