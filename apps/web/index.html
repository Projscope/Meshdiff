<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) is loaded conditionally from src/lib/analytics.ts,
         production builds only — see initAnalytics() in main.tsx. -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meshdiff — Compare 3D Model Versions (STL, 3MF, OBJ Diff Tool)</title>
    <meta
      name="description"
      content="Meshdiff compares two versions of a 3D model and shows exactly what changed: added material, removed material, and dimensional drift. Free, in-browser voxel and surface-heatmap diffing for STL, 3MF, and OBJ files — nothing is uploaded."
    />
    <meta
      name="keywords"
      content="3D model diff, 3D diff, STL compare, STL diff, STL diff tool, compare STL files, 3MF diff, OBJ diff, objdiff, compare 3D models, compare two 3D models, mesh diff, 3D printing version control, CAD version comparison, voxel diff"
    />
    <meta name="author" content="Meshdiff" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4338ca" />

    <link rel="canonical" href="https://meshdiff.com/" />

    <!-- Landing page's hero screenshot is the LCP element, but it only
         appears once React renders (client-side, no SSR) — Lighthouse
         flags this as "not discoverable in the initial document".
         Referencing it here lets Vite fingerprint it into the build as
         usual while still emitting a real <link rel=preload> in the
         initial HTML, so the browser starts fetching it immediately
         instead of waiting on JS to run first. -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/live-diff-preview.webp" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meshdiff" />
    <meta property="og:title" content="Meshdiff — Compare 3D Model Versions" />
    <meta
      property="og:description"
      content="See exactly what changed between two 3D model versions — added material, removed material, dimensional drift. Free, in-browser, STL/3MF/OBJ."
    />
    <meta property="og:url" content="https://meshdiff.com/" />
    <meta property="og:image" content="https://meshdiff.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meshdiff — Compare 3D Model Versions" />
    <meta
      name="twitter:description"
      content="See exactly what changed between two 3D model versions — added material, removed material, dimensional drift. Free, in-browser, STL/3MF/OBJ."
    />
    <meta name="twitter:image" content="https://meshdiff.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Meshdiff",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (runs in any modern browser)",
        "description": "Meshdiff compares two versions of a 3D model (STL, 3MF, OBJ) and shows exactly what changed: added material, removed material, and dimensional drift. Diffing runs entirely client-side.",
        "url": "https://meshdiff.com/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Meshdiff requires JavaScript to run — it's a browser-based 3D diff tool.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
