<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) is loaded conditionally from src/lib/analytics.ts,
         production builds only — see initAnalytics() in main.tsx. -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applies the stored light/dark preference before first paint —
         without this, the page would flash dark (the default) then swap
         to light a moment after React mounts and useTheme() runs. -->
    <script>
      (function () {
        var theme = localStorage.getItem("meshdiff_theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <title>Meshdiff — Compare 3D Model Versions (STL, 3MF, OBJ Diff Tool)</title>
    <meta
      name="description"
      content="Meshdiff compares two versions of a 3D model and shows exactly what changed: added material, removed material, and dimensional drift. Free, in-browser voxel and surface-heatmap diffing for STL, 3MF, and OBJ files — nothing is uploaded."
    />
    <meta name="author" content="Meshdiff" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#15181e" />

    <link rel="canonical" href="https://meshdiff.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- The live-tool preview screenshot sits just below the hero and only
         appears once React renders (client-side, no SSR), so the browser
         wouldn't normally discover it until JS runs. Referencing it here
         lets Vite fingerprint it into the build as usual while still
         emitting a real <link rel=preload> in the initial HTML, so the
         fetch starts immediately instead of waiting on JS. -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/live-diff-preview.webp" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meshdiff" />
    <meta property="og:title" content="Meshdiff — Compare 3D Model Versions" />
    <meta
      property="og:description"
      content="See exactly what changed between two 3D model versions — added material, removed material, dimensional drift. Free, in-browser, STL/3MF/OBJ."
    />
    <meta property="og:url" content="https://meshdiff.com/" />
    <meta property="og:image" content="https://meshdiff.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meshdiff — Compare 3D Model Versions" />
    <meta
      name="twitter:description"
      content="See exactly what changed between two 3D model versions — added material, removed material, dimensional drift. Free, in-browser, STL/3MF/OBJ."
    />
    <meta name="twitter:image" content="https://meshdiff.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Meshdiff",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (runs in any modern browser)",
        "description": "Meshdiff compares two versions of a 3D model (STL, 3MF, OBJ) and shows exactly what changed: added material, removed material, and dimensional drift. Diffing runs entirely client-side.",
        "url": "https://meshdiff.com/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Pure HTML/CSS fallback — no JS, no client-side framework, so it
         renders even with scripting fully disabled. Only shown when
         JavaScript is off; on the marketing/content routes it sits below
         the prerendered content already in #root (see scripts/prerender.mjs)
         but the diff tool itself (/live) genuinely needs JS/WASM/WebGL to
         run, so this is the only thing a no-JS visitor to that route sees. -->
    <noscript>
      <style>
        .nojs-fallback {
          max-width: 640px;
          margin: 0 auto;
          padding: 64px 24px;
          font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
          color: #e6e9ef;
          text-align: center;
        }
        .nojs-fallback h1 {
          font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
          font-size: 28px;
          font-weight: 700;
          margin: 0 0 12px;
        }
        .nojs-fallback p {
          font-size: 15px;
          line-height: 1.6;
          color: #aab1c0;
          margin: 0 0 24px;
        }
        .nojs-fallback img {
          display: block;
          width: 100%;
          max-width: 560px;
          margin: 0 auto 24px;
          border-radius: 12px;
          border: 1px solid #2a2f3a;
        }
        .nojs-fallback a {
          display: inline-block;
          padding: 10px 20px;
          border-radius: 8px;
          background: #10b981;
          color: #022c22;
          font-weight: 600;
          text-decoration: none;
          margin: 0 6px;
        }
        .nojs-fallback a.secondary {
          background: transparent;
          border: 1px solid #3a4150;
          color: #e6e9ef;
        }
      </style>
      <div class="nojs-fallback">
        <img src="/og-image.png" alt="Meshdiff's diff viewer showing added and removed geometry between two 3D model versions" width="1200" height="630" />
        <h1>Meshdiff compares two 3D model versions and shows what changed</h1>
        <p>
          Added material, removed material, and dimensional drift between two STL, 3MF, or OBJ files — computed as
          a voxel and surface-heatmap diff, entirely in your browser. The comparison tool itself needs JavaScript
          (it runs via WebAssembly and WebGL) to actually render a diff, so enable JavaScript to use it.
        </p>
        <a href="/docs">Read the docs</a>
        <a class="secondary" href="/stl-diff">See how it works</a>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
