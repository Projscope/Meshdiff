<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="team-explainer-title">
  <title id="team-explainer-title">Meshdiff Team features: version review workflow, approval gates, comments and mentions, and team roles</title>
  <style>
    <![CDATA[
      text {
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .eyebrow { fill: rgb(90,100,120); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
      .heading { fill: rgb(245,247,251); font-size: 22px; font-weight: 700; }
      .label { fill: rgb(170,181,200); font-size: 12px; }
      .muted { fill: rgb(90,100,120); font-size: 12px; }
      .dot-inactive { fill: rgb(51,59,74); }
      .dot-active { fill: rgb(52,211,153); }
      .line { stroke: rgb(38,44,56); stroke-width: 2; }
      .panel-inactive { fill: rgb(38,44,56); stroke: rgb(51,59,74); stroke-width: 1.5; }
      .panel-active { fill: rgba(52,211,153,0.14); stroke: rgb(52,211,153); stroke-width: 1.5; }
      .btn-inactive { fill: rgb(38,44,56); }
      .btn-active { fill: rgb(52,211,153); }
      .btn-text-inactive { fill: rgb(90,100,120); font-size: 13px; font-weight: 600; }
      .btn-text-active { fill: rgb(21,24,30); font-size: 13px; font-weight: 600; }
      .bubble { fill: rgb(38,44,56); stroke: rgb(51,59,74); stroke-width: 1; }
      .bubble-text { fill: rgb(232,236,243); font-size: 13px; }
      .mention { fill: rgb(52,211,153); font-weight: 600; }

      /* ---- Scene cross-fade: one 16s loop, four 4s scenes ---- */
      .scene { opacity: 0; animation: sceneFade 16s ease-in-out infinite; }
      /* Negative animation-delay of magnitude D makes an element's own
         keyframe clock read (elapsed + D) at all times — i.e. it starts
         ALREADY D seconds into its cycle, not "D seconds from now" — so
         to make scene2's *content* (built around an absolute T=4-8s
         window below) actually become visible during T=4-8s, its delay
         has to be -12s (16 - 4), not -4s. Verified against a real failing
         Playwright run before landing on these values; see the spec. */
      .scene1 { animation-delay: 0s; }
      .scene2 { animation-delay: -12s; }
      .scene3 { animation-delay: -8s; }
      .scene4 { animation-delay: -4s; }
      @keyframes sceneFade {
        0%   { opacity: 0; }
        2%   { opacity: 1; }
        23%  { opacity: 1; }
        25%  { opacity: 0; }
        100% { opacity: 0; }
      }

      /* ---- Step-reveal helper: switches class-driven fills stay put once
         triggered (parent scene hides again before the next loop reaches
         this element's own trigger point, so no visible reset pop). ---- */
      @keyframes revealAvatar1 { 0%, 3.7%  { opacity: 0; transform: translateY(6px); } 4%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes revealAvatar2 { 0%, 7.4%  { opacity: 0; transform: translateY(6px); } 7.5%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes revealAvatar3 { 0%, 11.1% { opacity: 0; transform: translateY(6px); } 11.2%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes revealAvatar4 { 0%, 14.8% { opacity: 0; transform: translateY(6px); } 14.9%, 100% { opacity: 1; transform: translateY(0); } }
      .avatar1 { animation: revealAvatar1 16s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .avatar2 { animation: revealAvatar2 16s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .avatar3 { animation: revealAvatar3 16s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .avatar4 { animation: revealAvatar4 16s ease-out infinite; transform-box: fill-box; transform-origin: center; }

      @keyframes pulse { 0%, 100% { stroke-opacity: 0.5; } 50% { stroke-opacity: 1; } }
      .invite-btn { animation: pulse 1.6s ease-in-out infinite; }

      @keyframes dotOn1 { 0%, 28.7% { fill: rgb(51,59,74); } 28.8%, 100% { fill: rgb(52,211,153); } }
      @keyframes dotOn2 { 0%, 32.4% { fill: rgb(51,59,74); } 32.5%, 100% { fill: rgb(52,211,153); } }
      @keyframes dotOn3 { 0%, 36.1% { fill: rgb(51,59,74); } 36.2%, 100% { fill: rgb(52,211,153); } }
      @keyframes dotOn4 { 0%, 39.9% { fill: rgb(51,59,74); } 40%,   100% { fill: rgb(52,211,153); } }
      @keyframes dotOn5 { 0%, 43.6% { fill: rgb(51,59,74); } 43.7%, 100% { fill: rgb(52,211,153); } }
      .rdot1 { animation: dotOn1 16s linear infinite; }
      .rdot2 { animation: dotOn2 16s linear infinite; }
      .rdot3 { animation: dotOn3 16s linear infinite; }
      .rdot4 { animation: dotOn4 16s linear infinite; }
      .rdot5 { animation: dotOn5 16s linear infinite; }

      @keyframes checkOn1 { 0%, 53.5% { fill: rgb(38,44,56); } 53.6%, 100% { fill: rgb(52,211,153); } }
      @keyframes checkOn2 { 0%, 57.2% { fill: rgb(38,44,56); } 57.3%, 100% { fill: rgb(52,211,153); } }
      @keyframes checkOn3 { 0%, 60.9% { fill: rgb(38,44,56); } 61%,   100% { fill: rgb(52,211,153); } }
      @keyframes markOn1 { 0%, 53.5% { opacity: 0; } 53.6%, 100% { opacity: 1; } }
      @keyframes markOn2 { 0%, 57.2% { opacity: 0; } 57.3%, 100% { opacity: 1; } }
      @keyframes markOn3 { 0%, 60.9% { opacity: 0; } 61%,   100% { opacity: 1; } }
      .check1 { animation: checkOn1 16s linear infinite; }
      .check2 { animation: checkOn2 16s linear infinite; }
      .check3 { animation: checkOn3 16s linear infinite; }
      .mark1 { animation: markOn1 16s linear infinite; }
      .mark2 { animation: markOn2 16s linear infinite; }
      .mark3 { animation: markOn3 16s linear infinite; }

      @keyframes approveOn { 0%, 65% { fill: rgb(38,44,56); } 65.5%, 100% { fill: rgb(52,211,153); } }
      @keyframes approveTextOn { 0%, 65% { fill: rgb(90,100,120); } 65.5%, 100% { fill: rgb(21,24,30); } }
      .approve-btn { animation: approveOn 16s linear infinite; }
      .approve-text { animation: approveTextOn 16s linear infinite; }

      @keyframes pinDrop { 0%, 78.7% { opacity: 0; transform: translateY(-14px); } 79%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes bubbleIn { 0%, 81.9% { opacity: 0; transform: translateY(6px); } 82%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes badgeIn { 0%, 85.6% { opacity: 0; transform: scale(0.4); } 86%, 100% { opacity: 1; transform: scale(1); } }
      .pin { animation: pinDrop 16s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .comment-bubble { animation: bubbleIn 16s ease-out infinite; transform-box: fill-box; transform-origin: left; }
      .notif-badge { animation: badgeIn 16s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    ]]>
  </style>

  <rect x="1" y="1" width="718" height="418" rx="20" fill="rgb(27,31,39)" stroke="rgb(38,44,56)" stroke-width="1.5" />
  <text x="32" y="38" class="eyebrow">Meshdiff · Team plan</text>

  <!-- Scene 1: Team roles & seats -->
  <g class="scene scene1">
    <text x="32" y="76" class="heading">Team roles &amp; seats</text>
    <text x="32" y="98" class="muted">Invite teammates, assign a role, pay per seat.</text>

    <g class="avatar1">
      <circle cx="140" cy="230" r="34" class="panel-active" />
      <text x="140" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="rgb(52,211,153)">O</text>
      <text x="140" y="285" text-anchor="middle" class="label">Owner</text>
    </g>
    <g class="avatar2">
      <circle cx="280" cy="230" r="34" class="panel-active" />
      <text x="280" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="rgb(52,211,153)">A</text>
      <text x="280" y="285" text-anchor="middle" class="label">Admin</text>
    </g>
    <g class="avatar3">
      <circle cx="420" cy="230" r="34" class="panel-active" />
      <text x="420" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="rgb(52,211,153)">Ap</text>
      <text x="420" y="285" text-anchor="middle" class="label">Approver</text>
    </g>
    <g class="avatar4">
      <circle cx="560" cy="230" r="34" class="panel-active" />
      <text x="560" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="rgb(52,211,153)">M</text>
      <text x="560" y="285" text-anchor="middle" class="label">Member</text>
    </g>

    <g class="invite-btn">
      <rect x="290" y="330" width="140" height="34" rx="17" fill="rgb(38,44,56)" stroke="rgb(52,211,153)" stroke-width="1.5" />
      <text x="360" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(52,211,153)">+ Invite teammate</text>
    </g>
  </g>

  <!-- Scene 2: Version review workflow -->
  <g class="scene scene2">
    <text x="32" y="76" class="heading">Version review workflow</text>
    <text x="32" y="98" class="muted">Every upload moves through a real approval state machine.</text>

    <line x1="90" y1="220" x2="630" y2="220" class="line" />
    <circle cx="90" cy="220" r="13" class="rdot1" />
    <circle cx="225" cy="220" r="13" class="rdot2" />
    <circle cx="360" cy="220" r="13" class="rdot3" />
    <circle cx="495" cy="220" r="13" class="rdot4" />
    <circle cx="630" cy="220" r="13" class="rdot5" />

    <text x="90" y="258" text-anchor="middle" class="label">Draft</text>
    <text x="225" y="258" text-anchor="middle" class="label">In Review</text>
    <text x="360" y="258" text-anchor="middle" class="label">
      <tspan x="360" dy="0">Changes</tspan>
      <tspan x="360" dy="14">Requested</tspan>
    </text>
    <text x="495" y="258" text-anchor="middle" class="label">Approved</text>
    <text x="630" y="258" text-anchor="middle" class="label">Superseded</text>
  </g>

  <!-- Scene 3: Approval gates -->
  <g class="scene scene3">
    <text x="32" y="76" class="heading">Approval gates</text>
    <text x="32" y="98" class="muted">Every checklist item has to pass before Approve unlocks.</text>

    <rect x="90" y="150" width="24" height="24" rx="6" class="check1" />
    <text x="102" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="rgb(21,24,30)" class="mark1">✓</text>
    <text x="130" y="167" class="bubble-text">Geometry reviewed</text>

    <rect x="90" y="200" width="24" height="24" rx="6" class="check2" />
    <text x="102" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="rgb(21,24,30)" class="mark2">✓</text>
    <text x="130" y="217" class="bubble-text">Printability checked</text>

    <rect x="90" y="250" width="24" height="24" rx="6" class="check3" />
    <text x="102" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="rgb(21,24,30)" class="mark3">✓</text>
    <text x="130" y="267" class="bubble-text">Manufacturing review</text>

    <rect x="90" y="320" width="130" height="38" rx="8" class="approve-btn" />
    <text x="155" y="344" text-anchor="middle" class="approve-text">Approve v14</text>
  </g>

  <!-- Scene 4: Comments & mentions -->
  <g class="scene scene4">
    <text x="32" y="76" class="heading">Comments &amp; @mentions</text>
    <text x="32" y="98" class="muted">Feedback pinned to the exact spot on the model.</text>

    <text x="150" y="270" font-size="72">🧊</text>
    <g class="pin">
      <text x="215" y="205" font-size="28">📍</text>
    </g>

    <g class="comment-bubble">
      <rect x="330" y="150" width="330" height="86" rx="12" class="bubble" />
      <text x="352" y="180" class="bubble-text">
        <tspan class="mention">@sarah</tspan><tspan> can you check this</tspan>
      </text>
      <text x="352" y="200" class="bubble-text">fillet before we approve v14?</text>
      <text x="352" y="222" class="muted">Alex · just now</text>
    </g>

    <g class="notif-badge">
      <text x="600" y="300" font-size="30">🔔</text>
      <circle cx="618" cy="286" r="10" fill="rgb(248,113,113)" />
      <text x="618" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
    </g>
  </g>
</svg>
