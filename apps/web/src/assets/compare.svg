<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <!-- Voxel Glow Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background & Grid -->
  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Center Viewport Divider Line -->
  <line x1="400" y1="40" x2="400" y2="410" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- LEFT MODEL (VERSION A - REMOVED GEOMETRY) -->
  <g transform="translate(200, 240)">
    <!-- Base Plate -->
    <polygon points="-110,-20 0,-75 110,-20 0,35" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <polygon points="-110,-20 0,35 0,65 -110,10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <polygon points="110,-20 0,35 0,65 110,10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Main Body Mesh Block -->
    <polygon points="-70,-60 0,-95 70,-60 0,-25" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <polygon points="-70,-60 0,-25 0,25 -70,-10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <polygon points="70,-60 0,-25 0,25 70,-10" fill="#334155" stroke="#475569" stroke-width="1.5" />

    <!-- Removed Voxel Block (RED) -->
    <g filter="url(#glow-red)">
      <polygon points="-20,-115 20,-135 60,-115 20,-95" fill="#ef4444" opacity="0.85" />
      <polygon points="-20,-115 20,-95 20,-65 -20,-85" fill="#dc2626" opacity="0.85" />
      <polygon points="60,-115 20,-95 20,-65 60,-85" fill="#f87171" opacity="0.85" />
    </g>

    <!-- Version Label -->
    <rect x="-45" y="85" width="90" height="22" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="0" y="100" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Version A</text>
  </g>

  <!-- RIGHT MODEL (VERSION B - ADDED GEOMETRY) -->
  <g transform="translate(600, 240)">
    <!-- Base Plate -->
    <polygon points="-110,-20 0,-75 110,-20 0,35" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <polygon points="-110,-20 0,35 0,65 -110,10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <polygon points="110,-20 0,35 0,65 110,10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Main Body Mesh Block -->
    <polygon points="-70,-60 0,-95 70,-60 0,-25" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <polygon points="-70,-60 0,-25 0,25 -70,-10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <polygon points="70,-60 0,-25 0,25 70,-10" fill="#334155" stroke="#475569" stroke-width="1.5" />

    <!-- Added Voxel Flange (GREEN) -->
    <g filter="url(#glow-green)">
      <polygon points="-70,-60 -20,-85 20,-65 -30,-40" fill="#22c55e" opacity="0.85" />
      <polygon points="-70,-60 -30,-40 -30,0 -70,-20" fill="#16a34a" opacity="0.85" />
      <polygon points="20,-65 -30,-40 -30,0 20,-25" fill="#4ade80" opacity="0.85" />
    </g>

    <!-- Version Label -->
    <rect x="-45" y="85" width="90" height="22" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="0" y="100" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Version B</text>
  </g>

  <!-- UI HUD Overlays -->
  <!-- Top Left Stats Badge -->
  <rect x="24" y="24" width="140" height="32" rx="6" fill="#18181b" stroke="#27272a" />
  <circle cx="40" cy="40" r="4" fill="#ef4444" />
  <text x="52" y="44" font-family="sans-serif" font-size="12" font-weight="600" fill="#f87171">-340 voxels</text>

  <!-- Top Right Stats Badge -->
  <rect x="636" y="24" width="140" height="32" rx="6" fill="#18181b" stroke="#27272a" />
  <circle cx="652" cy="40" r="4" fill="#22c55e" />
  <text x="664" y="44" font-family="sans-serif" font-size="12" font-weight="600" fill="#4ade80">+1,280 voxels</text>

  <!-- Viewport Coordinate Axis (Bottom Left) -->
  <g transform="translate(45, 400)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#ef4444" stroke-width="2" />
    <text x="30" y="4" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444">X</text>
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#22c55e" stroke-width="2" />
    <text x="-3" y="-30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e">Y</text>
    <line x1="0" y1="0" x2="-15" y2="15" stroke="#3b82f6" stroke-width="2" />
    <text x="-24" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3b82f6">Z</text>
  </g>
</svg>
